name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: director
          POSTGRES_PASSWORD: director
          POSTGRES_DB: director
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U director"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      # CI runs entirely on fakes: no provider keys, no spend (AGENTS.md §11).
      PROVIDERS: fake
      # Throwaway CI database and auth secret: not real credentials.
      DATABASE_URL: postgres://director:director@localhost:5432/director
      DATABASE_URL_UNPOOLED: postgres://director:director@localhost:5432/director
      DATABASE_URL_TEST: postgres://director:director@localhost:5432/director_test
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      INNGEST_DEV: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # Production runs Node 24 (ADR-021); CI checks the same runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The money path against real Postgres: parallel reserves never overdraw (AGENTS.md §9).
      - name: Create the integration test database
        run: psql postgres://director:director@localhost:5432/director -c "CREATE DATABASE director_test"
      - run: npm run test:integration

      - run: npm run db:migrate
      # The E2E journey casts from a roster: fictional placeholders, never real people (ADR-024).
      - run: npm run talent:seed -- --fake
      - run: npm run build

      - name: Start the app and the Inngest dev server
        run: |
          npm run start -- --port 3100 &
          npx inngest-cli dev --no-discovery -u http://localhost:3100/api/inngest &
          npx wait-on --timeout 120000 http://localhost:3100 http://localhost:8288
          curl -fsS -X PUT http://localhost:3100/api/inngest

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
