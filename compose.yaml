# Local development database only. Deployed environments use Neon (ADR-003).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: director
      POSTGRES_PASSWORD: director
      POSTGRES_DB: director
    ports:
      - "5432:5432"
    volumes:
      - director-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U director"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  director-pg:
